<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniHogar | Encuentra tu lugar</title><style>
:root{--navy:#142b3d;--teal:#117c78;--teal-d:#0d605d;--mint:#e6f5f1;--bg:#f7f9fb;--muted:#5b6b7a;--border:#dce5ea;--amber:#a66b14;--rose:#c0392b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--navy);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid #7fd6c3;outline-offset:2px;border-radius:8px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px max(24px,calc((100vw - 1160px)/2));background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);gap:16px;position:sticky;top:0;z-index:5}
.brand{font-size:24px;font-weight:850;letter-spacing:-1px;color:var(--teal);background:none;border:0;padding:0;display:flex;align-items:center}.brand span{color:var(--navy)}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--teal);color:#fff;padding:12px 18px;border-radius:11px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--teal-d);transform:translateY(-1px)}.btn:active{transform:none}
.btn.light{background:#eaf4f2;color:var(--teal)}.btn.light:hover{background:#d9ece8}
.btn.outline{background:#fff;color:var(--navy);border:1px solid var(--border)}.btn.outline:hover{background:#f3f7f9}
.btn.outline[aria-current=page]{border-color:var(--teal);color:var(--teal);background:#eff9f6}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
main{max-width:1160px;margin:auto;padding:28px 24px 70px;min-height:70vh}
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:center;padding:36px 0}
.kicker{color:var(--teal);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1.3px}
.hero h1{font-size:clamp(36px,5.3vw,62px);line-height:1.06;letter-spacing:-2px;margin:12px 0 18px}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p{font-size:18px;line-height:1.6;color:#4a5f72;max-width:590px}
.heroArt{background:linear-gradient(145deg,#d6eee5,#f2f6e7);min-height:390px;border-radius:27px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.house{font-size:150px;filter:drop-shadow(0 16px 15px #7ca5a15c);animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.float{position:absolute;background:#fff;border-radius:16px;box-shadow:0 12px 35px #244b3d2e;padding:13px 17px;font-weight:700}.float.one{top:35px;left:20px}.float.two{right:15px;bottom:35px}
.panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 28px #2646530a}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.cols2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.small{color:var(--muted);font-size:14px;line-height:1.55}
.pill{font-size:12px;display:inline-block;background:#e8f5ee;color:#176c55;border-radius:20px;padding:5px 10px;font-weight:700}
.pill.warn{background:#fff5e3;color:var(--amber)}.pill.bad{background:#fdecea;color:var(--rose)}
h2{font-size:30px;letter-spacing:-.8px;margin:0 0 12px}h3{margin:9px 0}.section{margin:36px 0}
.field{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:700;margin-bottom:15px}
.field input,.field select{background:#fff;width:100%;padding:12px;border:1px solid #ccd9e0;border-radius:10px;color:var(--navy)}
.field input:focus,.field select:focus{outline:2px solid #a3dfcd;border-color:var(--teal)}
.formBox{max-width:510px;margin:25px auto}.error{color:#ad3333;font-size:13px;min-height:18px}
.roomGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.room{padding:0;overflow:hidden;position:relative;transition:.2s}.room:hover{transform:translateY(-3px);box-shadow:0 16px 36px #26465320}
.roomArt{height:170px;background:linear-gradient(135deg,#dae9e6,#f3ede1);display:grid;place-items:center;font-size:70px}
.roomContent{padding:18px}.room h3{font-size:19px;line-height:1.25}
.roomPrice{font-size:24px;font-weight:850;color:var(--teal)}
.inline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.filters .field{margin:0}
.steps{display:flex;gap:8px;align-items:center;margin-bottom:22px}.step{background:#e8edf1;border-radius:20px;height:8px;flex:1;transition:.3s}.step.active{background:var(--teal)}
.choices{display:grid;gap:9px;margin:20px 0}
.choice{display:flex;gap:11px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}
.choice:hover{border-color:#9fd3c8}.choice:has(input:checked){border-color:var(--teal);background:#eff9f6;box-shadow:0 0 0 2px #cdeee6}
.choice input{accent-color:var(--teal);width:18px;height:18px}
.notice{border-left:4px solid #bd8738;background:#fff8ed;padding:13px 16px;margin:20px 0;color:#6b552d;font-size:14px;border-radius:0 10px 10px 0}
.detailGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:start}
.photo{border-radius:17px;background:linear-gradient(135deg,#d3eae2,#f2e9da);min-height:300px;display:grid;place-items:center;font-size:120px}
.footer{text-align:center;color:#6d8190;font-size:12px;padding:25px;max-width:760px;margin:auto;line-height:1.6}
.empty{text-align:center;padding:45px}
.logoIcon{display:inline-block;background:var(--teal);color:#fff;border-radius:9px;padding:3px 9px;margin-right:5px}
ul{line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 0}
.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px}.stat b{display:block;font-size:30px;color:var(--teal);letter-spacing:-1px}
.icoBox{width:44px;height:44px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:22px}
.heart{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fffffff0;font-size:20px;display:grid;place-items:center;box-shadow:0 4px 14px #0002;color:#9aa8b4;transition:.15s;padding:0}
.heart:hover{transform:scale(1.1)}.heart.on{color:#e0455a}
.cost{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}.cost td{padding:9px 0;border-bottom:1px dashed var(--border)}.cost td:last-child{text-align:right;font-weight:700}
.cost tr.total td{border-bottom:0;border-top:2px solid var(--navy);font-size:16px;color:var(--teal);padding-top:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:13px 20px;border-radius:12px;box-shadow:0 12px 30px #0004;opacity:0;pointer-events:none;transition:.3s;z-index:20;font-size:14px;font-weight:600;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.residentGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:18px}
.residentCard{padding:16px;border:1px solid var(--border);border-radius:14px;background:#fff}
.residentHead{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.residentHead .pill{margin-left:auto}
.avatar{width:55px;height:55px;border-radius:50%;background:#dff2ed;display:grid;place-items:center;font-size:30px;flex-shrink:0}.avatar.big{width:90px;height:90px;font-size:50px}
.tinyTags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tinyTags span{font-size:12px;background:#f1f5f7;padding:6px 8px;border-radius:8px}
.residentList{display:grid;gap:12px;margin:12px 0}.residentList .residentCard{background:#f8fbfa}.residentList .residentHead{gap:7px}.residentList .avatar{width:44px;height:44px;font-size:25px}.residentList .residentHead .pill{margin-left:0}
.habitGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.habit{display:flex;gap:9px;background:#f5f9fa;border:1px solid var(--border);padding:11px;border-radius:10px}.habit>span{font-size:22px}
.comparison{padding:12px 0;border-bottom:1px solid var(--border);display:grid;gap:5px}.comparison .pill{justify-self:start}.profileHead{margin-bottom:20px}
.meter{height:8px;background:#e8edf1;border-radius:9px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,#4fc3a9,var(--teal));border-radius:9px}
.mine{display:grid;gap:8px;margin:18px 0;text-align:left}.mine div{display:flex;justify-content:space-between;gap:10px;background:#f5f9fa;border-radius:10px;padding:10px 12px;font-size:14px}
@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.hero,.detailGrid,.cols3,.cols2,.stats{grid-template-columns:1fr}.roomGrid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.heroArt{min-height:270px}.hero{padding-top:15px}.top{padding:12px 18px}.nav .btn{padding:9px 10px;font-size:12px}.residentGrid,.habitGrid{grid-template-columns:1fr}}
@media(max-width:500px){.roomGrid,.filters{grid-template-columns:1fr}.nav{gap:3px}.top{align-items:flex-start;flex-direction:column}.hero h1{font-size:37px}main{padding:20px 15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.seg{display:inline-flex;background:#eef3f5;border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--teal);box-shadow:0 2px 8px #0002}
.emojiPick{display:flex;gap:8px;flex-wrap:wrap}.emojiPick button{width:52px;height:52px;border-radius:12px;border:1px solid var(--border);background:#fff;font-size:26px}
.emojiPick button[aria-pressed=true]{border-color:var(--teal);background:#eff9f6;box-shadow:0 0 0 2px #cdeee6}
.chk{display:flex;gap:9px;align-items:center;font-size:14px;padding:8px 0}.chk input{accent-color:var(--teal);width:18px;height:18px}
.sticky{position:sticky;top:84px}
.reqTop{display:flex;gap:12px;align-items:center}
.listRow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.listRow .roomArt{width:84px;height:84px;border-radius:14px;font-size:40px;flex-shrink:0}
@media(max-width:800px){.sticky{position:static}}
</style></head><body>
<header class="top"><button class="brand" onclick="go('home')" aria-label="UniHogar, inicio"><span class="logoIcon">U</span>Uni<span>Hogar</span></button><nav class="nav" id="nav" aria-label="Principal"></nav></header>
<main id="app" aria-live="polite"></main><div class="toast" id="toast" role="status"></div>
<footer class="footer">UniHogar · Prototipo académico de validación · Anuncios y perfiles ficticios · No procesamos pagos ni verificamos identidades reales.</footer>
<script>
const rooms=[{id:1,dm:1,extra:40,name:'Habitación luminosa en Barranco',district:'Barranco',price:950,mins:14,type:'Individual',bath:'Compartido',bills:'Agua e internet incluidos; luz aparte',deposit:'1 mes',rules:'No fiestas; visitas hasta las 9 p. m.',emoji:'🛏️',roomie:'Sofía, 20 años · estudia por la noche',habits:{sleep:'noche',clean:'alta',noise:'bajo'},verified:'Documentación pendiente de revisión'},{id:2,dm:1,extra:90,name:'Departamento compartido en Surquillo',district:'Surquillo',price:760,mins:24,type:'Compartido',bath:'Compartido',bills:'Servicios estimados S/ 90 adicionales',deposit:'1 mes',rules:'Turnos semanales de limpieza; visitas coordinadas',emoji:'🏙️',roomie:'Diego, 22 años · madruga',habits:{sleep:'temprano',clean:'alta',noise:'medio'},verified:'Documentación pendiente de revisión'},{id:3,dm:1,extra:60,name:'Cuarto independiente en Chorrillos',district:'Chorrillos',price:680,mins:35,type:'Individual',bath:'Privado',bills:'Agua incluida; electricidad e internet aparte',deposit:'1 mes',rules:'Sin mascotas y sin reuniones nocturnas',emoji:'🏡',roomie:null,habits:null,verified:'Sin verificación independiente'},{id:4,dm:2,extra:0,name:'Habitación cerca de campus en Barranco',district:'Barranco',price:1250,mins:10,type:'Compartido',bath:'Privado',bills:'Todos los servicios incluidos',deposit:'2 meses',rules:'Silencio desde las 10 p. m.',emoji:'🪴',roomie:'Andrea, 21 años · horarios flexibles',habits:{sleep:'noche',clean:'media',noise:'bajo'},verified:'Documentación pendiente de revisión'},{id:5,dm:1,extra:70,name:'Cuarto estudiantil en Surquillo',district:'Surquillo',price:840,mins:29,type:'Individual',bath:'Compartido',bills:'Servicios S/ 70 adicionales',deposit:'1 mes',rules:'No fumar; visitantes registrados',emoji:'🏠',roomie:null,habits:null,verified:'Sin verificación independiente'}];
const questions=[{key:'sleep',title:'¿Qué horario de descanso prefieres?',opts:[['temprano','Dormir y despertar temprano'],['noche','Dormir y despertar tarde'],['flexible','Mis horarios son flexibles']]},{key:'clean',title:'¿Qué nivel de orden esperas en casa?',opts:[['alta','Orden y limpieza rigurosos'],['media','Orden moderado'],['flexible','Soy flexible']]},{key:'noise',title:'¿Qué ambiente prefieres para estudiar?',opts:[['bajo','Silencioso'],['medio','Ruido moderado'],['flexible','Me adapto a ambos']]}];
const residents={
1:[{name:'Sofía',age:20,study:'Estudiante de ingeniería',emoji:'👩🏽‍💻',intro:'Soy tranquila, estudio por las noches y me gusta compartir espacios ordenados.',sleep:'noche',clean:'alta',noise:'bajo',visits:'Ocasionales, siempre coordinadas',cooking:'Cocino en casa 4 días por semana',shared:'Prefiero dividir tareas semanalmente',pets:'Prefiero vivir sin mascotas',weekend:'Salgo algunos sábados',values:'Respeto de horarios y comunicación directa'}],
2:[{name:'Diego',age:22,study:'Estudiante universitario',emoji:'👨🏽‍🎓',intro:'Me levanto temprano, entreno antes de clases y cuido los espacios comunes.',sleep:'temprano',clean:'alta',noise:'medio',visits:'Amigos una vez por semana',cooking:'Preparo mi desayuno y cena',shared:'Calendario de limpieza',pets:'No tengo mascotas',weekend:'Deporte y descanso',values:'Puntualidad y acuerdos claros'},{name:'Valeria',age:21,study:'Estudiante de arquitectura',emoji:'👩🏻‍🎨',intro:'Tengo entregas nocturnas algunos días y prefiero conversar los desacuerdos.',sleep:'noche',clean:'media',noise:'bajo',visits:'Visitas puntuales, con aviso previo',cooking:'Cocino los fines de semana',shared:'Limpieza compartida',pets:'Me gustan, con acuerdo de todos',weekend:'Descanso o paseo',values:'Comunicación y tranquilidad'}],
3:[],
4:[{name:'Andrea',age:21,study:'Estudiante de diseño',emoji:'👩🏻‍💻',intro:'Tengo horarios de estudio variables, pero respeto los momentos de silencio.',sleep:'noche',clean:'media',noise:'bajo',visits:'Una o dos visitas al mes',cooking:'Cocino con frecuencia',shared:'Reparto equitativo de tareas',pets:'Sin mascotas por ahora',weekend:'Leo y visito amigos',values:'Respeto por la privacidad'},{name:'Camila',age:23,study:'Estudiante universitaria',emoji:'👩🏽‍🎓',intro:'Disfruto estudiar en casa y mantener ambientes tranquilos.',sleep:'temprano',clean:'alta',noise:'bajo',visits:'Pocas visitas',cooking:'Cocino a diario',shared:'Organización semanal',pets:'Sin mascotas',weekend:'Actividades al aire libre',values:'Limpieza y buena convivencia'}],
5:[]};

const habitLabels={sleep:{temprano:'Duermo y despierto temprano',noche:'Suelo estudiar o dormir tarde',flexible:'Horarios flexibles'},clean:{alta:'Muy ordenado/a',media:'Orden moderado',flexible:'Flexible con el orden'},noise:{bajo:'Prefiero silencio',medio:'Acepto ruido moderado',flexible:'Flexible con el ruido'}};

function ld(k,d){try{return JSON.parse(localStorage.getItem('uh_'+k)||JSON.stringify(d))}catch(e){return d}}
function save(k,v){try{localStorage.setItem('uh_'+k,JSON.stringify(v))}catch(e){}}
const defFilters=()=>({district:'Todos',budget:state.user?.budget||1500,type:'Todos',minutes:60,sort:'rel',favOnly:false});
let profiles=ld('profiles',null)||{estudiante:ld('user',null),arrendador:null};
let state={role:ld('role','estudiante'),user:null,listings:ld('listings',[]),answers:ld('answers',{}),requests:ld('requests',[]),favs:ld('favs',[]),quizStep:0,returnTo:null,view:'home'};
state.user=profiles[state.role];state.filters=defFilters();
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
const done=()=>Object.keys(state.answers).length===3;
function go(view,id){state.view=view;state.id=id;nav();window.scrollTo(0,0);render()}
function affinity(h,ans){ans=ans||state.answers;if(!h||Object.keys(ans).length<3)return null;let s=0;['sleep','clean','noise'].forEach(k=>{if(ans[k]===h[k])s+=1;else if(ans[k]==='flexible')s+=.75;else if(h[k]==='flexible')s+=.5});return Math.round(s/3*100)}
const percentFor=affinity, compatibility=r=>affinity(r.habits);
const money=n=>'S/ '+n.toLocaleString('es-PE');
function initial(r){return r.price*(1+r.dm)}
function toggleFav(id,e){e&&e.stopPropagation();const i=state.favs.indexOf(id);if(i>-1){state.favs.splice(i,1);toast('Quitada de guardados')}else{state.favs.push(id);toast('♥ Guardada para comparar después')}save('favs',state.favs);render()}
function openResident(id,i){state.personIndex=i;go('resident',id)}

function roomCard(r){const c=compatibility(r),fav=state.favs.includes(r.id),over=state.user&&r.price>state.user.budget;
return `<article class="panel room"><button class="heart ${fav?'on':''}" aria-pressed="${fav}" aria-label="${fav?'Quitar de guardados':'Guardar habitación'}" onclick="toggleFav(${r.id},event)">${fav?'♥':'♡'}</button><div class="roomArt" aria-hidden="true">${r.emoji}</div><div class="roomContent"><div class="inline"><span class="pill">${esc(r.district)} · ${r.mins} min est.</span>${c!==null?`<span class="pill">${c}% afinidad</span>`:''}</div><h3>${esc(r.name)}</h3><div class="small">${esc(r.type)} · Baño ${esc(r.bath.toLowerCase())}</div><div class="small" style="margin-top:6px">Para entrar: <b>${money(initial(r))}</b> <span title="Primer mes + garantía">(1.er mes + garantía)</span></div>${over?'<div style="margin-top:8px"><span class="pill bad">Sobre tu presupuesto</span></div>':''}<div class="inline" style="margin-top:14px"><div><span class="roomPrice">${money(r.price)}</span><span class="small"> / mes</span></div><button class="btn" onclick="go('detail',${r.id})">Ver detalle →</button></div></div></article>`}

function homeStudent(){app.innerHTML=`<section class="hero"><div><div class="kicker">Para universitarios que llegan a Lima</div><h1>Encuentra un hogar, <em>no solo un cuarto.</em></h1><p>Compara cuartos cerca de tu campus, conoce los hábitos de tus posibles compañeros y calcula cuánto necesitas realmente para mudarte, antes de decidir.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="go('search')">Explorar habitaciones →</button><button class="btn light" onclick="go('quiz')">Hacer test de convivencia</button></div><p class="small">Prototipo académico · Inmuebles simulados · Enfocado inicialmente en estudiantes que llegan a Lima desde provincia</p></div><div class="heroArt"><div class="house">🏡</div><div class="float one">📍 Cerca del campus</div><div class="float two">🤝 Convivencia compatible</div></div></section>
<section class="section"><div class="stats"><div class="stat"><b>9 de 9</b><span class="small">universitarios entrevistados se mudaron al menos una vez</span></div><div class="stat"><b>S/ 300–1,600</b><span class="small">gastados antes de instalarse (garantía, hospedaje, mudanza)</span></div><div class="stat"><b>0</b><span class="small">filtros de compatibilidad en las alternativas actuales</span></div></div><p class="small">Datos de la validación del problema (9 entrevistas, UTEC).</p></section>
<section class="section"><h2>¿Cómo funciona?</h2><div class="cols3"><div class="panel"><div class="icoBox">📝</div><h3>1. Crea tu perfil</h3><p class="small">Registra tu nombre, correo universitario y presupuesto.</p></div><div class="panel"><div class="icoBox">🧩</div><h3>2. Descubre tu afinidad</h3><p class="small">Responde tres preguntas sobre tus hábitos de convivencia.</p></div><div class="panel"><div class="icoBox">💸</div><h3>3. Compara costos reales</h3><p class="small">Ve cuánto pagas al entrar y cada mes, con reglas claras, antes de pedir una visita.</p></div></div></section>
<section class="section"><div class="inline"><h2>Habitaciones de ejemplo</h2><button class="btn outline" onclick="go('search')">Ver todas</button></div><div class="roomGrid">${rooms.slice(0,3).map(roomCard).join('')}</div></section><section class="panel section"><div class="inline"><div><span class="kicker">¿Tienes un cuarto disponible?</span><h2>Publícalo y recibe estudiantes compatibles</h2><p class="small">Crea un perfil de arrendador y publica tu propiedad en 3 pasos.</p></div><button class="btn" onclick="setRole('arrendador')">🏠 Soy arrendador →</button></div></section>`}

function quiz(){const i=state.quizStep;

 const comparisons=['sleep','clean','noise'].map(k=>({title:{sleep:'Horarios de sueño',clean:'Limpieza y orden',noise:'Ambiente para estudiar'}[k],mine:state.answers[k],other:p[k],key:k}));

er?'Coincidencia':'Conversarlo antes de mudarte'}</span></div>`).join('')}`}<h3>Preguntas útiles antes de decidir</h3><ul class="small"><li>¿Qué horarios de descanso respetamos?</li><li>¿Cómo se reparten limpieza y gastos?</li><li>¿Cómo acordamos las visitas?</li></ul><button class="btn" onclick="go('detail',${r.id})">Ver habitación y solicitar visita</button></aside></div>`}

function search(){const f=state.filters;
 let matches=allRooms().filter(r=>(f.district==='Todos'||r.district===f.district)&&r.price<=f.budget&&(f.type==='Todos'||r.type===f.type)&&r.mins<=f.minutes&&(!f.favOnly||state.favs.includes(r.id)));

 matches=matches.slice().sort(sorters[f.sort]||sorters.rel);

 <div class="inline"><h3 aria-live="polite">${matches.length} ${matches.length===1?'habitación':'habitaciones'} de ejemplo</h3>${done()?'<span class="pill">Test completado ✓</span>':`<button class="btn light" onclick="state.quizStep=0;go('quiz')">Completa tu test para ver afinidad</button>`}</div>
 <h3>Habitaciones disponibles</h3><div class="roomGrid section">${matches.length?matches.map(roomCard).join(''):'<div class="panel empty" style="grid-column:1/-1"><div style="font-size:42px">🔎</div><h3>No hay resultados con esos filtros</h3><p class="small">Prueba ampliar tu presupuesto, la zona o el tiempo de traslado.</p><button class="btn" onclick="document.getElementById(\'reset\').click()">Limpiar filtros</button></div>'}</div>
 <section class="panel section"><div class="inline"><div><span class="kicker">Según tus filtros</span><h2>Conoce con quién convivirías</h2><p class="small">Hábitos y costumbres de las personas asociadas a los alojamientos de arriba. Son perfiles ficticios.</p></div>${done()?'<span class="pill">Afinidad personalizada activa</span>':`<button class="btn light" onclick="state.quizStep=0;go('quiz')">Hacer test de afinidad</button>`}</div><div class="residentGrid">${people.map(x=>residentCard(x.p,x.id,x.i)).join('')||'<p class="small">No hay perfiles de convivencia para estos resultados (algunos alojamientos son individuales).</p>'}</div></section>`;
 const upd=()=>{state.filters={district:district.value,budget:Number(budget.value)||1500,type:type.value,minutes:Number(minutes.value),sort:sort.value,favOnly:favOnly.checked};search()};
 ['district','budget','type','minutes','sort','favOnly'].forEach(id=>document.getElementById(id).onchange=upd);
 document.getElementById('reset').onclick=()=>{state.filters=defFilters();search()}}

 const sent=state.requests.some(x=>x.id===r.id&&x.email===state.user?.email),over=state.user&&r.price>state.user.budget;

 const rr=state.requests.filter(x=>x.email===state.user.email);

function peopleOf(id){const l=state.listings.find(x=>x.id===id);return l?(l.people||[]):(residents[id]||[])}
function allRooms(){return rooms.concat(state.listings.filter(l=>l.active!==false))}
function roomById(id){return rooms.concat(state.listings).find(r=>r.id===id)}
function verText(r){if(!r.owner)return r.verified;return profiles.arrendador&&profiles.arrendador.email===r.owner&&profiles.arrendador.verified?'Arrendador verificado (demo)':'Documentación pendiente de revisión'}
const isL=()=>state.role==='arrendador';
function pendingCount(){return state.user&&isL()?state.requests.filter(x=>x.owner===state.user.email&&x.status.startsWith('Pend')).length:0}

function login(){const L=isL(),u=state.user||{};
 app.innerHTML=`<div class="formBox panel"><span class="pill">${L?'🏠 Perfil de arrendador':'🎓 Perfil de estudiante'}</span><h2 style="margin-top:12px">${state.user?'Mi cuenta':'Regístrate para comenzar'}</h2><p class="small">La demo crea una sesión local en este navegador. No se realiza autenticación real.</p><form id="register" novalidate><label class="field">Nombre completo<input name="name" required maxlength="70" autocomplete="name" placeholder="Ej. ${L?'Rosa Medina':'María Fernández'}" value="${esc(u.name||'')}"></label><label class="field">${L?'Correo':'Correo universitario'}<input name="email" type="email" required maxlength="90" autocomplete="email" placeholder="${L?'nombre@correo.com':'nombre@universidad.edu.pe'}" value="${esc(u.email||'')}"></label>${L?`<label class="field">Celular (9 dígitos)<input name="phone" inputmode="numeric" maxlength="9" placeholder="9XXXXXXXX" value="${esc(u.phone||'')}"></label><label class="field">Eres<select name="kind">${['Propietario/a directo','Administrador/a','Inmobiliaria'].map(x=>`<option ${x===u.kind?'selected':''}>${x}</option>`).join('')}</select></label>`:`<label class="field">Universidad<input name="university" required placeholder="Ej. UTEC" value="${esc(u.university||'')}"></label><label class="field">Presupuesto mensual máximo (S/)<input name="budget" type="number" inputmode="numeric" required min="300" max="5000" value="${u.budget||1000}"></label>`}<p id="err" class="error" role="alert"></p><button class="btn" type="submit">Guardar mi perfil</button></form><p class="small">No ingreses datos reales sensibles: es solo una demostración académica.</p></div>`;
 document.getElementById('register').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),err=document.getElementById('err');const name=String(f.get('name')).trim(),email=String(f.get('email')).trim();

  profiles[state.role]=user;state.user=user;saveProfiles();toast('Perfil guardado ✓');const t=state.returnTo||(L?'myprops':'profile'),i=state.returnId;state.returnTo=null;state.returnId=null;go(t,i)}}

function profile(){if(!state.user)return go('login');const u=state.user;
 if(isL()){const mine=state.listings.filter(l=>l.owner===u.email).length;
  app.innerHTML=`<div class="inline"><div><span class="kicker">Perfil de arrendador</span><h2>Hola, ${esc(u.name.split(' ')[0])} 👋</h2><p class="small">${esc(u.kind)} · ${esc(u.email)} · 📞 ${esc(u.phone)}</p></div><button class="btn outline" onclick="go('login')">Editar perfil</button></div><div class="cols3 section"><div class="panel"><h3>Verificación</h3><p><span class="pill ${u.verified?'':'warn'}">${u.verified?'Arrendador verificado (demo)':'Pendiente de revisión'}</span></p><p class="small">Los estudiantes ven esta etiqueta en tus anuncios. En un producto real implicaría validar documentos; aquí es una simulación.</p><button class="btn light" onclick="toggleVerify()">${u.verified?'Quitar verificación':'Subir documento (simulado)'}</button></div><div class="panel"><h3>Mis propiedades</h3><p class="small">${mine} publicada${mine===1?'':'s'}</p><button class="btn" onclick="go('myprops')">Ver propiedades</button></div><div class="panel"><h3>Solicitudes</h3><p class="small">${pendingCount()} pendiente${pendingCount()===1?'':'s'}</p><button class="btn light" onclick="go('inbox')">Abrir bandeja</button></div></div><button class="btn outline" onclick="logout()">Cerrar sesión de demostración</button>`;return}
 const mine=state.requests.filter(x=>x.email===u.email).length;
 app.innerHTML=`<div class="inline"><div><span class="kicker">Mi perfil</span><h2>Hola, ${esc(u.name.split(' ')[0])} 👋</h2><p class="small">${esc(u.university)} · ${esc(u.email)}</p></div><button class="btn outline" onclick="go('login')">Editar perfil</button></div><div class="cols3 section"><div class="panel"><h3>Tu búsqueda</h3><p>Presupuesto máximo: <b>${money(u.budget)}</b></p><button class="btn" onclick="go('search')">Explorar cuartos</button></div><div class="panel"><h3>Tu compatibilidad</h3><p class="small">${done()?'Test completado. Ya ves la afinidad en los anuncios con roommate.':'Aún no has completado el test de convivencia.'}</p><button class="btn light" onclick="state.quizStep=0;go('quiz')">${done()?'Repetir test':'Hacer test'}</button></div><div class="panel"><h3>Tu actividad</h3><p class="small">♥ ${state.favs.length} guardadas · 📨 ${mine} solicitudes</p><button class="btn light" onclick="state.filters.favOnly=true;go('search')">Ver guardadas</button></div></div><button class="btn outline" onclick="logout()">Cerrar sesión de demostración</button>`}
function toggleVerify(){state.user.verified=!state.user.verified;profiles.arrendador=state.user;saveProfiles();toast(state.user.verified?'Perfil verificado (demo) ✓':'Verificación retirada');profile()}
function logout(){profiles[state.role]=null;saveProfiles();state.user=null;state.filters=defFilters();toast('Sesión cerrada');go('home')}

function request(id){
 if(isL()){toast('Cambia a la vista Estudiante para solicitar una visita');return}
 if(!state.user){state.returnTo='detail';state.returnId=id;toast('Crea tu perfil de demostración para enviar la solicitud');go('login');return}
 if(state.requests.some(x=>x.id===id&&x.email===state.user.email))return;const r=roomById(id);
 state.requests.push({id,email:state.user.email,name:state.user.name,university:state.user.university,owner:r?.owner||null,answers:{...state.answers},status:'Pendiente (demo)',date:new Date().toLocaleDateString('es-PE')});
 save('requests',state.requests);toast('Solicitud enviada ✓ (demo)');go('requests')}

/* ===== Arrendador: publicar ===== */
function newDraft(){return{step:0,name:'',district:'Barranco',address:'',mins:15,type:'Individual',bath:'Compartido',emoji:'🛏️',price:'',dm:1,bills:'Agua e internet incluidos; luz aparte',extra:40,rules:['Visitas coordinadas'],rulesText:'',hasRoomie:false,p:{name:'',age:'',study:'Estudiante universitario/a',intro:'',sleep:'noche',clean:'media',noise:'bajo'},agree:false}}
let draft=newDraft();
function pd(k,v){draft[k]=v;pv()}function pp(k,v){draft.p[k]=v}
function draftRoom(){const d=draft;return{id:0,name:d.name||'Título de tu anuncio',district:d.district,price:Number(d.price)||0,mins:Number(d.mins)||0,type:d.type,bath:d.bath,dm:Number(d.dm),extra:Number(d.extra)||0,emoji:d.emoji,habits:null}}
function pv(){const el=document.getElementById('pv');if(el)el.innerHTML=roomCard(draftRoom())}
function toggleRule(r){const i=draft.rules.indexOf(r);i>-1?draft.rules.splice(i,1):draft.rules.push(r)}
function publishStart(){if(!state.user){state.returnTo='publish';toast('Primero crea tu perfil de arrendador');go('login');return}go('publish')}
function opts(list,sel){return list.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}
function habitSel(k,v,fn){return `<select onchange="${fn}('${k}',this.value)">${Object.entries(habitLabels[k]).map(([a,l])=>`<option value="${a}" ${a===v?'selected':''}>${l}</option>`).join('')}</select>`}
function publish(){if(!isL()||!state.user)return go('home');const d=draft,s=d.step,names=['La propiedad','Costos y reglas','Convivencia'];let body='';
 if(s===0)body=`<label class="field">Título del anuncio<input maxlength="70" value="${esc(d.name)}" oninput="pd('name',this.value)" placeholder="Ej. Habitación luminosa cerca de UTEC"></label><div class="cols2"><label class="field">Distrito<select onchange="pd('district',this.value)">${opts(DISTRICTS,d.district)}</select></label><label class="field">Minutos al campus<input type="number" min="1" max="90" value="${esc(d.mins)}" oninput="pd('mins',this.value)"></label></div><label class="field">Dirección (privada)<input maxlength="90" value="${esc(d.address)}" oninput="pd('address',this.value)" placeholder="Calle y número"></label><p class="small" style="margin-top:-8px">La dirección exacta solo se compartiría con estudiantes cuya visita aceptes.</p><div class="cols2"><label class="field">Tipo de habitación<select onchange="pd('type',this.value)">${opts(['Individual','Compartido'],d.type)}</select></label><label class="field">Baño<select onchange="pd('bath',this.value)">${opts(['Compartido','Privado'],d.bath)}</select></label></div><div class="field">Imagen del anuncio (demo)<div class="emojiPick">${EMOJIS.map(e=>`<button type="button" aria-pressed="${e===d.emoji}" onclick="pd('emoji','${e}');publish()">${e}</button>`).join('')}</div><span class="small" style="font-weight:400">En la versión real aquí se subirían fotos.</span></div>`;
 if(s===1)body=`<div class="cols2"><label class="field">Alquiler mensual (S/)<input type="number" inputmode="numeric" min="300" max="5000" step="10" value="${esc(d.price)}" oninput="pd('price',this.value)"></label><label class="field">Garantía<select onchange="pd('dm',Number(this.value));pv()">${[0,1,2,3].map(n=>`<option value="${n}" ${n===Number(d.dm)?'selected':''}>${n===0?'Sin garantía':n+(n>1?' meses':' mes')}</option>`).join('')}</select></label></div><label class="field">Servicios incluidos<input maxlength="90" value="${esc(d.bills)}" oninput="pd('bills',this.value)"></label><label class="field">Servicios no incluidos, estimado mensual (S/)<input type="number" min="0" max="500" value="${esc(d.extra)}" oninput="pd('extra',this.value)"></label><div class="field">Reglas de convivencia${RULES.map(r=>`<label class="chk"><input type="checkbox" ${d.rules.includes(r)?'checked':''} onchange="toggleRule('${r}')">${r}</label>`).join('')}</div><label class="field">Otra regla (opcional)<input maxlength="90" value="${esc(d.rulesText)}" oninput="pd('rulesText',this.value)"></label>`;
 if(s===2)body=`<label class="chk"><input type="checkbox" ${d.hasRoomie?'checked':''} onchange="pd('hasRoomie',this.checked);publish()"><b>Ya vive alguien en la propiedad (roommate actual)</b></label><p class="small">Así los estudiantes pueden ver hábitos y afinidad antes de pedir una visita.</p>${d.hasRoomie?`<div class="cols2"><label class="field">Nombre<input maxlength="30" value="${esc(d.p.name)}" oninput="pp('name',this.value)"></label><label class="field">Edad<input type="number" min="18" max="60" value="${esc(d.p.age)}" oninput="pp('age',this.value)"></label></div><label class="field">Ocupación<input maxlength="50" value="${esc(d.p.study)}" oninput="pp('study',this.value)"></label><label class="field">Presentación breve<input maxlength="140" value="${esc(d.p.intro)}" oninput="pp('intro',this.value)" placeholder="Cómo es vivir con esta persona"></label><label class="field">Horario<br>${habitSel('sleep',d.p.sleep,'pp')}</label><label class="field">Orden y limpieza<br>${habitSel('clean',d.p.clean,'pp')}</label><label class="field">Ambiente para estudiar<br>${habitSel('noise',d.p.noise,'pp')}</label>`:''}<div class="notice">Este anuncio es de demostración: no se publica en ningún portal real.</div><label class="chk"><input type="checkbox" ${d.agree?'checked':''} onchange="pd('agree',this.checked)">Confirmo que la información es veraz y que entiendo que es un prototipo.</label>`;
 app.innerHTML=`<span class="kicker">Publicar propiedad · paso ${s+1} de 3</span><h2>${names[s]}</h2><div class="steps" aria-hidden="true">${names.map((_,j)=>`<span class="step ${j<=s?'active':''}"></span>`).join('')}</div><div class="detailGrid"><div class="panel"><form id="pubform" novalidate>${body}<p id="err" class="error" role="alert"></p><div class="inline"><button class="btn outline" type="button" onclick="pubBack()" ${s===0?'disabled':''}>← Atrás</button><button class="btn" type="submit">${s===2?'Publicar anuncio ✓':'Siguiente →'}</button></div></form></div><aside class="sticky"><span class="kicker">Así lo verán los estudiantes</span><div id="pv" style="margin-top:10px;pointer-events:none">${roomCard(draftRoom())}</div></aside></div>`;
 document.getElementById('pubform').onsubmit=e=>{e.preventDefault();pubNext()}}
function pubBack(){draft.step=Math.max(0,draft.step-1);publish();window.scrollTo(0,0)}
function pubNext(){const d=draft,s=d.step,err=document.getElementById('err'),n=Number;
 if(s===0){if(d.name.trim().length<8)return err.textContent='El título debe tener al menos 8 caracteres.';if(d.address.trim().length<5)return err.textContent='Indica la dirección (será privada).';if(!(n(d.mins)>=1&&n(d.mins)<=90))return err.textContent='Los minutos al campus deben estar entre 1 y 90.'}
 if(s===1){if(!(n(d.price)>=300&&n(d.price)<=5000))return err.textContent='El alquiler debe estar entre S/ 300 y S/ 5,000.';if(!(n(d.extra)>=0&&n(d.extra)<=500))return err.textContent='Los servicios estimados deben estar entre S/ 0 y S/ 500.'}
 if(s<2){d.step++;publish();window.scrollTo(0,0);return}
 if(d.hasRoomie){if(!d.p.name.trim())return err.textContent='Escribe el nombre del roommate.';if(!(n(d.p.age)>=18&&n(d.p.age)<=60))return err.textContent='La edad debe estar entre 18 y 60.'}
 if(!d.agree)return err.textContent='Debes confirmar la información para publicar.';
 const P=d.p,rules=[...d.rules,d.rulesText.trim()].filter(Boolean).join('; ')||'Sin reglas especiales',dm=n(d.dm);
 const l={id:Date.now(),owner:state.user.email,ownerName:state.user.name,name:d.name.trim(),district:d.district,address:d.address.trim(),price:n(d.price),mins:n(d.mins),type:d.type,bath:d.bath,bills:d.bills.trim()||'No especificado',extra:n(d.extra),dm,deposit:dm===0?'Sin garantía':dm+(dm>1?' meses':' mes'),rules,emoji:d.emoji,roomie:d.hasRoomie?`${P.name.trim()}, ${P.age} años · ${P.study.trim()}`:null,habits:d.hasRoomie?{sleep:P.sleep,clean:P.clean,noise:P.noise}:null,people:d.hasRoomie?[{name:P.name.trim(),age:n(P.age),study:P.study.trim(),emoji:'🧑🏽‍🎓',intro:P.intro.trim()||'Sin presentación.',sleep:P.sleep,clean:P.clean,noise:P.noise,visits:'No indicado',cooking:'No indicado',shared:'No indicado',pets:'No indicado',weekend:'No indicado',values:'No indicado'}]:[],active:true,created:new Date().toLocaleDateString('es-PE')};
 state.listings.push(l);save('listings',state.listings);draft=newDraft();toast('Anuncio publicado ✓ Ya aparece en la vista Estudiante');go('myprops')}

/* ===== Arrendador: panel y bandeja ===== */
function myprops(){if(!isL()||!state.user)return go('home');const me=state.user.email,mine=state.listings.filter(l=>l.owner===me),reqs=state.requests.filter(x=>x.owner===me);
 app.innerHTML=`<div class="inline"><div><span class="kicker">Panel del arrendador</span><h2>Mis propiedades</h2></div><button class="btn" onclick="publishStart()">+ Publicar propiedad</button></div>
 <div class="stats section"><div class="stat"><b>${mine.filter(l=>l.active!==false).length}</b><span class="small">anuncios activos</span></div><div class="stat"><b>${reqs.length}</b><span class="small">solicitudes recibidas</span></div><div class="stat"><b>${pendingCount()}</b><span class="small">por responder</span></div></div>
 ${state.user.verified?'':`<div class="notice">Tu perfil aún no está verificado. Los estudiantes confían más en anuncios verificados. <button class="btn light" onclick="go('profile')">Verificar (demo)</button></div>`}
 ${mine.length?`<div style="display:grid;gap:14px">${mine.map(l=>{const n=reqs.filter(x=>x.id===l.id).length;return `<div class="panel listRow"><div class="roomArt" aria-hidden="true">${l.emoji}</div><div style="flex:1;min-width:200px"><span class="pill ${l.active===false?'warn':''}">${l.active===false?'⏸ Pausado':'● Activo'}</span> <span class="pill">${esc(l.district)}</span><h3>${esc(l.name)}</h3><div class="small">${money(l.price)}/mes · entrada ${money(initial(l))} · ${n} solicitud${n===1?'':'es'} · publicado ${esc(l.created)}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn outline" onclick="viewAsStudent(${l.id})">Ver como estudiante</button><button class="btn light" onclick="togglePause(${l.id})">${l.active===false?'Reactivar':'Pausar'}</button><button class="btn outline" onclick="delListing(${l.id})">Eliminar</button></div></div>`}).join('')}</div><div class="notice">Para probar el flujo completo puedes <button class="btn light" onclick="simReq()">simular una solicitud de estudiante</button> y responderla en <b>Solicitudes</b>.</div>`:`<div class="panel empty"><div style="font-size:46px">🏠</div><h3>Aún no has publicado propiedades</h3><p class="small">Publica tu primer cuarto en 3 pasos y aparecerá en la búsqueda de los estudiantes.</p><button class="btn" onclick="publishStart()">Publicar mi primera propiedad</button></div>`}`}
function viewAsStudent(id){state.role='estudiante';save('role','estudiante');state.user=profiles.estudiante;state.filters=defFilters();go('detail',id)}
function togglePause(id){const l=state.listings.find(x=>x.id===id);l.active=l.active===false;save('listings',state.listings);toast(l.active?'Anuncio reactivado':'Anuncio pausado: ya no aparece en la búsqueda');myprops()}
function delListing(id){state.listings=state.listings.filter(x=>x.id!==id);state.requests=state.requests.filter(x=>x.id!==id);save('listings',state.listings);save('requests',state.requests);toast('Anuncio eliminado');nav();myprops()}
function simReq(){const me=state.user.email,l=state.listings.find(x=>x.owner===me&&x.active!==false);if(!l)return toast('Publica una propiedad activa primero');
 const s=STUDENTS.find(st=>!state.requests.some(x=>x.id===l.id&&x.email===st.email));if(!s)return toast('Ya simulaste todas las solicitudes disponibles');
 state.requests.push({id:l.id,email:s.email,name:s.name,university:s.university,owner:me,answers:s.answers,status:'Pendiente (demo)',date:new Date().toLocaleDateString('es-PE')});save('requests',state.requests);toast('Solicitud simulada de '+s.name);nav();render()}
function inbox(){if(!isL()||!state.user)return go('home');const me=state.user.email,list=state.requests.map((x,i)=>({x,i})).filter(o=>o.x.owner===me);
 app.innerHTML=`<div class="inline"><div><span class="kicker">Bandeja</span><h2>Solicitudes recibidas</h2><p class="small">El correo del estudiante solo se muestra cuando aceptas su solicitud.</p></div><button class="btn light" onclick="simReq()">Simular solicitud</button></div><div class="cols2 section">${list.length?list.map(({x,i})=>{const l=roomById(x.id),a=x.answers||{},has=Object.keys(a).length===3,aff=l&&l.habits&&has?affinity(l.habits,a):null,ok=x.status.startsWith('Acept'),no=x.status.startsWith('Rech');
  return `<div class="panel"><div class="reqTop"><div class="avatar" aria-hidden="true">🎓</div><div><b>${esc(x.name)}</b><div class="small">${esc(x.university||'Universidad no indicada')} · ${esc(x.date)}</div></div><span class="pill ${ok?'':no?'bad':'warn'}" style="margin-left:auto">${esc(x.status)}</span></div><p class="small" style="margin:12px 0 4px">Solicita: <b>${esc(l?.name||'Propiedad eliminada')}</b></p>${has?`<div class="tinyTags"><span>🕒 ${esc(habitLabels.sleep[a.sleep])}</span><span>🧹 ${esc(habitLabels.clean[a.clean])}</span><span>📚 ${esc(habitLabels.noise[a.noise])}</span></div>`:'<p class="small">El estudiante aún no completó el test de convivencia.</p>'}${aff!==null?`<div class="small">Afinidad con tu roommate actual: <b>${aff}%</b></div><div class="meter"><i style="width:${aff}%"></i></div>`:''}${ok?`<p class="small">✉️ Contacto: <b>${esc(x.email)}</b></p>`:''}${x.status.startsWith('Pend')?`<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="answerReq(${i},true)">Aceptar visita</button><button class="btn outline" onclick="answerReq(${i},false)">Rechazar</button></div>`:''}</div>`}).join(''):`<div class="panel empty" style="grid-column:1/-1"><div style="font-size:42px">📭</div><h3>Aún no tienes solicitudes</h3><p class="small">Cuando un estudiante pida una visita, aparecerá aquí con sus hábitos de convivencia.</p><button class="btn" onclick="simReq()">Simular una solicitud</button></div>`}</div>`}
function answerReq(i,ok){state.requests[i].status=ok?'Aceptada (demo)':'Rechazada (demo)';save('requests',state.requests);toast(ok?'Visita aceptada ✓':'Solicitud rechazada');nav();inbox()}
function render(){({home,login,profile,quiz,search,detail,requests,resident,myprops,publish,inbox}[state.view]||home)()}
go('home');

</script></body></html>
